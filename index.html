<title>Aura Roleplay</title>

<link rel="icon" href="https://cdn.discordapp.com/attachments/1438245396546584638/1510851404439490560/aura.png?ex=6a1e5185&is=6a1d0005&hm=51a63faaef66d5c772e0567c60410bcbb348f11e42647e17f32bc8958249afae&">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --text-color: #ffffff;
        --subtitle-color: rgba(255, 255, 255, 0.55);
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Fredoka', sans-serif;
        position: relative;
        color: var(--text-color);
    }

    .stars {
        position: fixed;
        inset: 0;
        z-index: 1;
    }

    .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle linear infinite;
    }

    @keyframes twinkle {
        0%, 100% {
            opacity: 0.15;
        }

        50% {
            opacity: 1;
        }
    }
    
    .container {
        text-align: center;
        z-index: 10;
        padding: 20px;
        animation: fadeIn 1.8s ease;
    }

    .logo {
        width: 220px;
        max-width: 50vw;
        margin-bottom: 30px;
        user-select: none;
        pointer-events: none;

        filter:
            drop-shadow(0 0 10px rgba(255,255,255,0.12))
            drop-shadow(0 0 25px rgba(255,255,255,0.08));

        animation: float 5s ease-in-out infinite;
    }

    .text-wrapper {
        position: relative;
        display: inline-block;
    }

    #textGlow {
        position: absolute;
        width: 280px;
        height: 280px;

        background: radial-gradient(
            circle,
            rgba(255,255,255,0.35) 0%,
            rgba(255,255,255,0.15) 35%,
            rgba(255,255,255,0.05) 50%,
            transparent 75%
        );

        transform: translate(-50%, -50%);
        filter: blur(45px);

        pointer-events: none;
        z-index: -1;

        transition:
            left 0.08s ease-out,
            top 0.08s ease-out;
    }

    h1 {
        font-size: clamp(2.2rem, 5vw, 4.5rem);
        text-transform: uppercase;
        letter-spacing: 3px;
        line-height: 1.1;

        text-shadow:
            0 0 10px rgba(255,255,255,0.12),
            0 0 25px rgba(255,255,255,0.08);
    }

    .subtitle {
        margin-top: 14px;

        font-size: clamp(0.85rem, 1.2vw, 1rem);

        color: var(--subtitle-color);

        text-transform: uppercase;
        letter-spacing: 2px;

        text-shadow:
            0 0 10px rgba(255,255,255,0.05);
    }

    .footer {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);

        color: rgba(255,255,255,0.25);

        font-size: 0.8rem;
        letter-spacing: 1px;

        z-index: 10;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    @media (max-width: 768px) {
        .logo {
            width: 180px;
        }

        #textGlow {
            width: 220px;
            height: 220px;
        }
    }
</style>
```

</head>
<body>

```
<div class="stars" id="stars"></div>

<div class="container">

    <img
        src="https://cdn.discordapp.com/attachments/1438245396546584638/1510851404439490560/aura.png?ex=6a1e5185&is=6a1d0005&hm=51a63faaef66d5c772e0567c60410bcbb348f11e42647e17f32bc8958249afae&"
        alt="Aura Roleplay"
        class="logo"
    >

    <div class="text-wrapper">
        <div id="textGlow"></div>

        <h1>Something Big Is Coming Soon...</h1>

        <p class="subtitle">
            Powered by Aura Systems
        </p>
    </div>

</div>

<div class="footer">
    © 2026 Aura Systems
</div>

<script>

    const starsContainer = document.getElementById("stars");

    for (let i = 0; i < 250; i++) {
        const star = document.createElement("div");

        star.className = "star";

        const size = Math.random() * 2.5 + 0.5;

        star.style.width = size + "px";
        star.style.height = size + "px";

        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";

        star.style.animationDuration =
            (Math.random() * 4 + 2) + "s";

        star.style.animationDelay =
            (Math.random() * 5) + "s";

        starsContainer.appendChild(star);
    }

    const glow = document.getElementById("textGlow");
    const wrapper = document.querySelector(".text-wrapper");

    document.addEventListener("mousemove", (e) => {
        const rect = wrapper.getBoundingClientRect();

        glow.style.left =
            (e.clientX - rect.left) + "px";

        glow.style.top =
            (e.clientY - rect.top) + "px";
    });

    window.addEventListener("load", () => {
        glow.style.left = "50%";
        glow.style.top = "50%";
    });
</script>
